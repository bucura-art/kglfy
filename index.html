<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BK Arena · Choose your seat</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="c"></canvas>

  <header class="top">
    <div class="brand">
      <span class="flag"><i></i><i></i><i></i></span>
      <div><b>BK ARENA</b><small><span id="event-name"></span> · <span id="event-date"></span></small></div>
    </div>
    <div class="right">
      <ul class="legend">
        <li><i id="lg-free" style="background:#1f9d55"></i>Available</li>
        <li><i id="lg-pick" style="background:#fad201"></i>Your pick</li>
        <li><i id="lg-hold" style="background:#00a1de"></i>On hold</li>
        <li><i style="background:#5a6068"></i>Taken</li>
      </ul>
      <a href="/admin" target="_blank" rel="noopener">Manage</a>
    </div>
  </header>

  <section id="hero">
    <p class="kicker">Kigali · Rwanda</p>
    <h1>BK Arena</h1>
    <p id="hero-event"></p>
    <button id="enter">Find your seat</button>
    <p class="sub">Step inside, pick a section, sit down and see the view before you buy.</p>
  </section>

  <nav id="crumbs" hidden></nav>
  <aside id="panel" hidden></aside>
  <div id="ticket" hidden></div>
  <div id="dock">
    <div id="confirm" hidden></div>
    <button id="back" data-d="0" hidden>View whole arena</button>
    <button id="showticket" data-act="show" hidden>Show ticket</button>
    <p id="hint"></p>
  </div>
  <div id="tip" hidden></div>
  <div id="toast" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
